<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salvation Ministries Youth Convention Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7F4EE;
  --navy:#123B5E;
  --blue:#1E6FA8;
  --crimson:#C11F2E;
  --gold:#D7A233;
  --ink:#16222B;
  --panel-black:#0A0A0B;
  --white:#FFFFFF;
  --font-display:'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
  --font-ui:'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-ui);
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.app-shell{
  width:100%;
  max-width:720px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}
.brand{
  width:100%;
  display:flex;
  justify-content:center;
}
.brand img{
  width:min(280px, 60vw);
  height:auto;
}
.clock-strip{
  font-family:var(--font-ui);
  font-weight:500;
  letter-spacing:0.08em;
  text-transform:uppercase;
  font-size:0.85rem;
  color:var(--navy);
  opacity:0.75;
}
.timer-stage{
  position:relative;
  width:100%;
  background:var(--panel-black);
  border-radius:18px;
  padding:clamp(28px,6vw,56px) 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  box-shadow:0 18px 40px rgba(10,10,11,0.25);
  overflow:hidden;
}
.timer-stage::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:4px;
  background:linear-gradient(90deg,var(--blue),var(--crimson));
}
.timer-eyebrow{
  margin:0;
  font-family:var(--font-ui);
  font-size:0.8rem;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--gold);
  outline:none;
  cursor:text;
  min-width:2ch;
  max-width:90%;
  text-align:center;
}
.timer-eyebrow:empty::before{
  content:'Tap to label this session';
  color:rgba(255,255,255,0.35);
}
.timer-display, .timer-edit-input{
  font-family:var(--font-display);
  font-size:clamp(4.5rem, 20vw, 11rem);
  line-height:1;
  color:var(--white);
  letter-spacing:0.02em;
  cursor:pointer;
  user-select:none;
  transition:color .3s ease;
  text-align:center;
}
.timer-edit-input{
  background:transparent;
  border:none;
  border-bottom:3px solid var(--gold);
  width:70%;
  cursor:text;
  outline:none;
}
.timer-stage.low .timer-display{color:var(--gold);}
.timer-stage.critical .timer-display{color:var(--crimson); animation:pulse 1s ease-in-out infinite;}
.timer-stage.done .timer-display{color:var(--crimson);}
.timer-stage.done{animation:flash 0.6s ease-in-out 3;}
@keyframes pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.04);}
}
@keyframes flash{
  0%,100%{background:var(--panel-black);}
  50%{background:var(--crimson);}
}
.fullscreen-btn{
  position:absolute;
  top:14px;right:14px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  color:var(--white);
  width:36px;height:36px;
  border-radius:8px;
  font-size:1rem;
  cursor:pointer;
}
.controls{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}
.preset-row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}
.preset-btn{
  font-family:var(--font-ui);
  font-weight:600;
  font-size:0.85rem;
  padding:8px 14px;
  border-radius:999px;
  border:1.5px solid var(--navy);
  background:transparent;
  color:var(--navy);
  cursor:pointer;
  transition:background .2s ease,color .2s ease;
}
.preset-btn:hover{background:var(--navy); color:var(--white);}
.custom-row{
  display:flex;
  align-items:center;
  gap:8px;
}
.custom-row input{
  width:64px;
  padding:8px 10px;
  border-radius:8px;
  border:1.5px solid rgba(18,59,94,0.3);
  font-family:var(--font-ui);
  font-size:0.9rem;
  text-align:center;
}
.custom-row button{
  font-family:var(--font-ui);
  font-weight:600;
  padding:9px 16px;
  border-radius:8px;
  border:none;
  background:var(--gold);
  color:var(--ink);
  cursor:pointer;
}
.primary-actions{
  display:flex;
  gap:12px;
}
.primary-actions button{
  font-family:var(--font-ui);
  font-weight:700;
  font-size:1rem;
  padding:12px 28px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  letter-spacing:0.02em;
}
#startPauseBtn{background:var(--crimson); color:var(--white);}
#resetBtn{background:transparent; color:var(--navy); border:1.5px solid var(--navy);}
.utility-row{
  display:flex;
  gap:10px;
}
.utility-row button{
  font-family:var(--font-ui);
  font-size:0.8rem;
  font-weight:600;
  padding:8px 14px;
  border-radius:8px;
  border:1.5px solid rgba(18,59,94,0.3);
  background:transparent;
  color:var(--navy);
  cursor:pointer;
}
.hint{
  font-size:0.72rem;
  color:rgba(18,59,94,0.55);
  text-align:center;
  margin:0;
}
button:focus-visible, .timer-eyebrow:focus-visible, .timer-display:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:2px;
}
body.is-fullscreen{
  background:var(--panel-black);
}
body.is-fullscreen .app-shell{
  max-width:100vw;
  height:100vh;
  justify-content:center;
  gap:28px;
}
body.is-fullscreen .brand img{
  width:min(200px,40vw);
}
body.is-fullscreen .controls{display:none;}
body.is-fullscreen .timer-stage{
  box-shadow:none;
  border-radius:0;
  background:var(--panel-black);
  padding:0;
}
body.is-fullscreen .timer-display{font-size:clamp(6rem,26vw,16rem);}
body.is-fullscreen .clock-strip{color:var(--white); opacity:0.6;}
@media (prefers-reduced-motion: reduce){
  .timer-stage.critical .timer-display{animation:none;}
  .timer-stage.done{animation:none;}
}
@media (max-width:480px){
  .primary-actions{flex-direction:column; width:100%;}
  .primary-actions button{width:100%;}
}
</style>
</head>

const timerStage = document.getElementById('timerStage');
const timerDisplay = document.getElementById('timerDisplay');
const timerEyebrow = document.getElementById('timerEyebrow');
const presetRow = document.getElementById('presetRow');
const customMinutes = document.getElementById('customMinutes');
const customSeconds = document.getElementById('customSeconds');
const setCustomBtn = document.getElementById('setCustomBtn');
const startPauseBtn = document.getElementById('startPauseBtn');
const resetBtn = document.getElementById('resetBtn');
const muteBtn = document.getElementById('muteBtn');
const fsBtn = document.getElementById('fsBtn');
const fsBtnInline = document.getElementById('fsBtnInline');

let durationSeconds = 25 * 60;
let remainingSeconds = durationSeconds;
let endTimestamp = null;
let running = false;
let rafId = null;
let muted = false;
let audioCtx = null;

function formatTime(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if(h > 0){
    return h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function updateDisplay(){
  timerDisplay.textContent = formatTime(remainingSeconds);
  timerStage.classList.toggle('low', remainingSeconds <= 60 && remainingSeconds > 10);
  timerStage.classList.toggle('critical', remainingSeconds <= 10 && remainingSeconds > 0);
}

function tick(){
  if(!running) return;
  const now = Date.now();
  remainingSeconds = (endTimestamp - now) / 1000;
  if(remainingSeconds <= 0){
    remainingSeconds = 0;
    updateDisplay();
    completeTimer();
    return;
  }
  updateDisplay();
  rafId = requestAnimationFrame(tick);
}

function startTimer(){
  if(running) return;
  if(remainingSeconds <= 0) remainingSeconds = durationSeconds;
  endTimestamp = Date.now() + remainingSeconds * 1000;
  running = true;
  startPauseBtn.textContent = 'Pause';
  timerStage.classList.remove('done');
  rafId = requestAnimationFrame(tick);
}

function pauseTimer(){
  running = false;
  startPauseBtn.textContent = 'Start';
  if(rafId) cancelAnimationFrame(rafId);
  if(endTimestamp){
    remainingSeconds = Math.max(0, (endTimestamp - Date.now()) / 1000);
  }
}

function resetTimer(){
  pauseTimer();
  remainingSeconds = durationSeconds;
  timerStage.classList.remove('low','critical','done');
  updateDisplay();
}

function setDuration(totalSeconds){
  durationSeconds = Math.max(1, Math.round(totalSeconds));
  remainingSeconds = durationSeconds;
  pauseTimer();
  timerStage.classList.remove('low','critical','done');
  updateDisplay();
}

function completeTimer(){
  running = false;
  startPauseBtn.textContent = 'Start';
  timerStage.classList.remove('low','critical');
  timerStage.classList.add('done');
  playChime();
  setTimeout(() => timerStage.classList.remove('done'), 1900);
}

function playChime(){
  if(muted) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    for(let i = 0; i < 3; i++){
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now + i * 0.5);
      gain.gain.exponentialRampToValueAtTime(0.35, now + i * 0.5 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.5 + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + i * 0.5);
      osc.stop(now + i * 0.5 + 0.45);
    }
  }catch(e){}
}

function parseTimeString(str){
  const parts = str.trim().split(':').map(p => parseInt(p, 10));
  if(parts.some(isNaN)) return null;
  let seconds = 0;
  if(parts.length === 3) seconds = parts[0] * 3600 + parts[1] * 60 + parts[2];
  else if(parts.length === 2) seconds = parts[0] * 60 + parts[1];
  else if(parts.length === 1) seconds = parts[0] * 60;
  else return null;
  return seconds > 0 ? seconds : null;
}

function enterEditMode(){
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'timer-edit-input';
  input.value = formatTime(remainingSeconds);
  input.inputMode = 'numeric';
  timerDisplay.replaceWith(input);
  input.focus();
  input.select();
  function commit(){
    const val = parseTimeString(input.value);
    if(val !== null) setDuration(val);
    input.replaceWith(timerDisplay);
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
    if(e.key === 'Escape'){ input.replaceWith(timerDisplay); }
  });
}

timerDisplay.addEventListener('click', () => { if(!running) enterEditMode(); });
timerDisplay.addEventListener('keydown', (e) => {
  if((e.key === 'Enter' || e.key === ' ') && !running){ e.preventDefault(); enterEditMode(); }
});

timerEyebrow.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); timerEyebrow.blur(); }
});

const presets = [5, 10, 15, 20, 30, 45, 60];
presets.forEach((min) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'preset-btn';
  btn.textContent = min + 'm';
  btn.addEventListener('click', () => setDuration(min * 60));
  presetRow.appendChild(btn);
});

setCustomBtn.addEventListener('click', () => {
  const mins = parseInt(customMinutes.value, 10) || 0;
  const secs = parseInt(customSeconds.value, 10) || 0;
  const total = mins * 60 + secs;
  if(total > 0){
    setDuration(total);
    customMinutes.value = '';
    customSeconds.value = '';
  }
});

startPauseBtn.addEventListener('click', () => { running ? pauseTimer() : startTimer(); });
resetBtn.addEventListener('click', resetTimer);

muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? 'Sound Off' : 'Sound On';
  muteBtn.setAttribute('aria-pressed', String(muted));
});

function toggleFullscreen(){
  if(!document.fullscreenElement){
    appShell.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}
fsBtn.addEventListener('click', toggleFullscreen);
fsBtnInline.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('is-fullscreen', !!document.fullscreenElement);
});

document.addEventListener('keydown', (e) => {
  const active = document.activeElement;
  if(active && (active.tagName === 'INPUT' || active.isContentEditable)) return;
  if(e.code === 'Space'){ e.preventDefault(); running ? pauseTimer() : startTimer(); }
  else if(e.key === 'r' || e.key === 'R'){ resetTimer(); }
  else if(e.key === 'f' || e.key === 'F'){ toggleFullscreen(); }
});

function updateClock(){
  const now = new Date();
  const dateStr = now.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  const timeStr = now.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  clockStrip.textContent = dateStr + ' \u00B7 ' + timeStr;
}
updateClock();
setInterval(updateClock, 1000);

updateDisplay();
</script>
</body>
</html>
